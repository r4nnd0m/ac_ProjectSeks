# Nur lokal: SQL und Redis auf 127.0.0.1 freigeben (Visual Studio, dotnet ef).
# Für das Deployment mit -f docker-compose.yml starten, dann wird diese Datei ignoriert.
services:
  sql:
    networks:
      - local-tools-net
    ports:
      - "127.0.0.1:1433:1433"
  redis:
    networks:
      - local-tools-net
    ports:
      - "127.0.0.1:6379:6379"

networks:
  local-tools-net:
    driver: bridge
