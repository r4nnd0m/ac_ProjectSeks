services:


  sql-init:
    image: busybox:latest
    user: root
    command: ["sh", "-c", "mkdir -p /var/opt/mssql/data /var/opt/mssql/log /var/opt/mssql/secrets && chown -R 10001:0 /var/opt/mssql"]
    volumes:
      - sqldata:/var/opt/mssql
    restart: "no"

  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:-${MSSQL_SA_PASSWORD:?SQL Server password required}}
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - backend-net
    depends_on:
      sql-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    volumes:
      - redis_data:/data
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  auth-api:
    build:
      context: .
      dockerfile: src/AuthApi/Dockerfile
    environment:
      - ConnectionStrings__Auth=Server=sql,1433;Database=sims;User Id=sa;Password=${SQL_PASSWORD:-${MSSQL_SA_PASSWORD:?SQL Server password required}};TrustServerCertificate=True
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__ExpiresMinutes=${JWT_EXPIRES_MINUTES}
      - Migrations__Run=${MIGRATIONS_RUN:-true}
      - Admin__Email=${ADMIN_EMAIL}
      - Admin__Password=${ADMIN_PASSWORD}
      - Cors__AllowedOrigins__0=${CORS_ALLOWED_ORIGINS_0:-${CORS_ALLOWED_ORIGIN:-http://localhost:8080}}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD}
    networks:
      - frontend-net
      - backend-net
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      sql:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  scan-api:
    build:
      context: .
      dockerfile: src/ScanApi/Dockerfile
    environment:
      - Migrations__Run=${MIGRATIONS_RUN:-true}
      - Escalation__CriticalHours=${ESCALATION_CRITICAL_HOURS:-4}
      - Escalation__HighHours=${ESCALATION_HIGH_HOURS:-24}
      - Escalation__MediumHours=${ESCALATION_MEDIUM_HOURS:-72}
      - ConnectionStrings__Sims=Server=sql,1433;Database=sims;User Id=sa;Password=${SQL_PASSWORD:-${MSSQL_SA_PASSWORD:?SQL Server password required}};TrustServerCertificate=True
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Cors__AllowedOrigins__0=${CORS_ALLOWED_ORIGINS_0:-${CORS_ALLOWED_ORIGIN:-http://localhost:8080}}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD}
    networks:
      - frontend-net
      - backend-net
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      sql:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  news-api:
    build:
      context: .
      dockerfile: src/NewsApi/Dockerfile
    environment:
      # Feste Feed-Liste (nur https). Ohne Angabe in .env gelten echte Standard-Feeds,
      # der dritte Feed (heise, Atom) kommt aus appsettings.json.
      - Feeds__Urls__0=${FEED_URL_1:-https://www.cert.at/cert-at.de.warnings.rss_2.0.xml}
      - Feeds__Urls__1=${FEED_URL_2:-https://www.cisa.gov/cybersecurity-advisories/all.xml}
      - News__RefreshMinutes=${NEWS_REFRESH_MINUTES:-30}
      - Cors__AllowedOrigins__0=${CORS_ALLOWED_ORIGINS_0:-${CORS_ALLOWED_ORIGIN:-http://localhost:8080}}
    # frontend-net ist nicht "internal": darüber erreicht der Dienst die externen Feeds.
    # Kein Redis nötig – der News-Service nutzt einen Speicher-Cache.
    networks:
      - frontend-net
    ports:
      - "127.0.0.1:8083:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/Worker/Dockerfile
    environment:
      - Escalation__CriticalHours=${ESCALATION_CRITICAL_HOURS:-4}
      - Escalation__HighHours=${ESCALATION_HIGH_HOURS:-24}
      - Escalation__MediumHours=${ESCALATION_MEDIUM_HOURS:-72}
      - ConnectionStrings__Sims=Server=sql,1433;Database=sims;User Id=sa;Password=${SQL_PASSWORD:-${MSSQL_SA_PASSWORD:?SQL Server password required}};TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD}
      - Verdict__EpssNoGoThreshold=${VERDICT_EPSS_NOGO_THRESHOLD:-0.5}
      - Worker__PollIntervalSeconds=${WORKER_POLL_INTERVAL_SECONDS:-30}
    networks:
      - backend-net
      - egress-net
    depends_on:
      sql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Change Security_opt zu security_opt 
    security_opt:          
      - no-new-privileges:true
    # Change Cap_drop zu cap_drop
    cap_drop:             
      - ALL
    restart: unless-stopped

  web:
    build:
      context: ./src/Web
      dockerfile: Dockerfile
    # config.js ist im Image enthalten (relative Pfade /api/...); nginx leitet an die APIs weiter.
    # Nur frontend-net: die Oberfläche braucht keinen Zugriff auf SQL und Redis.
    networks:
      - frontend-net
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - auth-api
      - scan-api
      - news-api
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  sqldata:
  redis_data:

networks:
  frontend-net:
    driver: bridge
  backend-net:
    internal: true
    driver: bridge
  egress-net:
    driver: bridge
