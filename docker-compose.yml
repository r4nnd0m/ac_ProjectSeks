services:
  # Setzt einmalig die Rechte im MSSQL-Volume (User mssql = UID 10001) und beendet sich danach
  sql-init:
    image: busybox:latest
    container_name: sql-init
    user: root
    command: ["sh", "-c", "mkdir -p /var/opt/mssql/data /var/opt/mssql/log /var/opt/mssql/secrets && chown -R 10001:0 /var/opt/mssql"]
    volumes:
      - mssql_data:/var/opt/mssql
    restart: "no"

  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql
    hostname: sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    depends_on:
      sql-init:
        condition: service_completed_successfully
    networks:
      - sims-net
    restart: unless-stopped

