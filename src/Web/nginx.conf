resolver 127.0.0.11 valid=10s ipv6=off;

upstream sims_auth {
    zone sims_auth 64k;
    server auth-api:8080 resolve;
}

upstream sims_scan {
    zone sims_scan 64k;
    server scan-api:8080 resolve;
}

upstream sims_news {
    zone sims_news 64k;
    server news-api:8080 resolve;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 5000000;

    location /api/auth/ { 
        proxy_pass http://sims_auth/; 
    }

    location /api/scan/ { 
        proxy_pass http://sims_scan/scan/; 
    }

    location /api/news/ { 
        proxy_pass http://sims_news/news/; 
    }

    location / { 
        try_files $uri $uri/ /index.html; 
    }
}