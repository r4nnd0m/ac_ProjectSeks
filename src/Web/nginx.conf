# SIMS-Weboberfläche: liefert das gebaute Frontend aus und leitet die
# API-Aufrufe an die Container weiter (gleicher Ursprung, kein CORS nötig).
# /api/auth/x -> auth-api:8080/x, /api/scan/x -> scan-api:8080/x, /api/news/x -> news-api:8080/x

resolver 127.0.0.11 valid=10s ipv6=off;

upstream sims_auth {
    zone sims_auth 64k;
    server auth-api:8080 resolve;
}

upstream sims_scan {
    zone sims_scan 64k;
    server scan-api:8080 resolve;
}

upstream sims_news {
    zone sims_news 64k;
    server news-api:8080 resolve;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # SBOM-Upload: höchstens 5 MB (E3)
    client_max_body_size 5m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Der abschließende Schrägstrich bei proxy_pass entfernt das Präfix /api/xyz/.
    location /api/auth/ { proxy_pass http://sims_auth/; }
    location /api/scan/ { proxy_pass http://sims_scan/; }
    location /api/news/ { proxy_pass http://sims_news/; }

    # config.js nie zwischenspeichern, damit Änderungen sofort greifen.
    location = /config.js { add_header Cache-Control "no-store" always; add_header X-Content-Type-Options "nosniff" always; }

    location / { try_files $uri $uri/ /index.html; }
}
